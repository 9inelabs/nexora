name: Build NEXORA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Test and build the Windows installer
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = "0.1.${{ github.run_number }}"
          "value=$v" >> $env:GITHUB_OUTPUT
          Write-Host "NEXORA $v"

      - name: Run the automatic checks
        run: dotnet test tests/Nexora.Tests -c Release --logger "console;verbosity=normal"

      - name: Publish NEXORA for Windows
        run: >
          dotnet publish src/Nexora.App/Nexora.App.csproj -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.version.outputs.value }} -p:DebugType=none -o publish

      - name: Add the recorder (FFmpeg)
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP/ffmpeg.zip"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP/ffmpeg"
          $bin = Get-ChildItem "$env:RUNNER_TEMP/ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force publish/ffmpeg | Out-Null
          Copy-Item $bin.FullName publish/ffmpeg/ffmpeg.exe
          Copy-Item (Join-Path $bin.DirectoryName "ffprobe.exe") publish/ffmpeg/ffprobe.exe
          Get-ChildItem $bin.Directory.Parent.FullName -Filter LICENSE* | Copy-Item -Destination publish/ffmpeg/
          & publish/ffmpeg/ffmpeg.exe -hide_banner -version | Select-Object -First 1
          if (Test-Path publish/libvlc) { Get-ChildItem publish/libvlc } else { Write-Warning "LibVLC folder not found in publish" }

      - name: Check the recorder works with this FFmpeg
        shell: cmd
        run: |
          set FF=publish\ffmpeg\ffmpeg.exe
          rem Make two seconds of raw frames first, then feed them to FFmpeg the way NEXORA does,
          rem so a refusal by the encoder fails this step (and the build) instead of a church's recording.
          %FF% -hide_banner -loglevel error -y -f lavfi -i color=black:s=1280x720:r=30 -frames:v 60 -f rawvideo -pix_fmt bgra "%RUNNER_TEMP%\frames.raw"
          if errorlevel 1 exit /b 1
          rem The same arguments NEXORA uses for a recording without a sound device.
          %FF% -hide_banner -loglevel error -nostats -progress pipe:1 -stats_period 1 -y -f rawvideo -pix_fmt bgra -s 1280x720 -r 30 -i pipe:0 -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=48000 -shortest -map 0:v -map 1:a -c:v libx264 -preset veryfast -tune zerolatency -b:v 6000k -maxrate 6000k -bufsize 12000k -pix_fmt yuv420p -g 60 -c:a aac -b:a 160k -ar 48000 -movflags +frag_keyframe+empty_moov+default_base_moof -f mp4 "%RUNNER_TEMP%\silent.mp4" < "%RUNNER_TEMP%\frames.raw" > nul
          if errorlevel 1 (echo The bundled FFmpeg refused NEXORA's recording settings & exit /b 1)
          for %%F in ("%RUNNER_TEMP%\silent.mp4") do if %%~zF LSS 1000 (echo The test recording is empty & exit /b 1)
          echo Silent recording OK
          rem The input options NEXORA uses for a sound device must still be accepted (a missing device is fine here).
          %FF% -hide_banner -loglevel error -f dshow -audio_buffer_size 50 -i "audio=No Such Device" -t 1 -f null - > "%RUNNER_TEMP%\dshow.txt" 2>&1
          type "%RUNNER_TEMP%\dshow.txt"
          findstr /i /c:"Option not found" /c:"cannot be applied" /c:"Error parsing options" "%RUNNER_TEMP%\dshow.txt" && (echo The bundled FFmpeg refused NEXORA's sound settings & exit /b 1)
          exit /b 0

      - name: Build the installer (Velopack)
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version 1.2.161
          vpk pack --packId Nexora --packVersion ${{ steps.version.outputs.value }} --packDir publish `
            --mainExe Nexora.exe --packTitle NEXORA --packAuthors NEXORA `
            --icon src/Nexora.App/Assets/nexora.ico --outputDir Releases
          Get-ChildItem Releases
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item Releases/Nexora-win-Setup.exe out/NEXORA-Setup.exe
          Copy-Item Releases/Nexora-win-Portable.zip out/NEXORA-Portable.zip
          Copy-Item docs/PHASE1-TESTING.md out/PHASE1-TESTING.md
          Copy-Item docs/PHASE2-TESTING.md out/PHASE2-TESTING.md
          Copy-Item docs/TESTING-PHASES-3-8.md out/TESTING-PHASES-3-8.md
          Copy-Item docs/OPERATOR-GUIDE.md out/OPERATOR-GUIDE.md
          # The files the Live Output PC offers to the other PCs (Settings > Updates).
          New-Item -ItemType Directory -Force update/NEXORA-Update | Out-Null
          Copy-Item Releases/releases.win.json update/NEXORA-Update/
          Copy-Item Releases/*-full.nupkg update/NEXORA-Update/
          Get-ChildItem out, update -Recurse | Select-Object FullName, Length

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-Setup-${{ steps.version.outputs.value }}
          path: |
            out/NEXORA-Setup.exe
            out/*.md
          retention-days: 30

      - name: Upload the LAN update files
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-Update-${{ steps.version.outputs.value }}
          path: update/*
          retention-days: 30

      - name: Publish a test release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: NEXORA ${{ steps.version.outputs.value }} (test build)
          prerelease: true
          body: |
            Test build of NEXORA. Download **NEXORA-Setup.exe** below and follow PHASE1-TESTING.md and TESTING-PHASES-3-8.md.
          files: |
            out/NEXORA-Setup.exe
            out/NEXORA-Portable.zip
            out/PHASE1-TESTING.md
            out/TESTING-PHASES-3-8.md
            out/OPERATOR-GUIDE.md
